<script type="module">
import * as THREE from 'three';
import '../splat-ref/src/game/kits/index.js';
import { Character } from '../splat-ref/src/game/character.js';
import { G } from '../splat-ref/src/core/ctx.js';

const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(1024,1200);renderer.autoClear=false;
renderer.toneMapping=THREE.NeutralToneMapping;renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.setClearColor('#1f262e');document.body.append(renderer.domElement);renderer.clear();

function transform(node,data){node.position.fromArray(data.position);node.quaternion.fromArray(data.quaternion);node.scale.fromArray(data.scale);node.visible=data.visible;if(data.authoredMatrix){node.matrixAutoUpdate=false;node.matrix.fromArray(data.authoredMatrix);}}
function parts(c){

 for(const [side,w] of [['right',c.weapon],['left',c.weapon.left]])if(w){for(const key of ['pivot','off','body','ink','bodyFar','inkFar','glow','drum','spin','muzzle'])tree(w[key],`weapon/${side}/${key}`,key==='off');for(const [key,node]of Object.entries(w.parts))tree(node,`weapon/${side}/parts/${key}`);}
 tree(c.weapon.pivotL,'weapon/mirror');tree(c.tank.group,'tank/group',false);tree(c.tank.fill,'tank/fill');tree(c.squidRoot,'squid');return out;
}
try{

 G.camera=null;G.actors=[];G.mode='match';

 for(const [index,{id,sub,style}]of entries.entries()){

  for(const key of ['root','model','kid'])transform(c[key],frame[key]);transform(c.squidRoot,frame.squid);
  c.boneList.forEach((bone,i)=>transform(bone,frame.bones[i]));
  const nodes=parts(c);for(const [name,data]of Object.entries(frame.parts)){const node=nodes.get(name);if(!node)throw new Error(`Missing source part ${name}`);transform(node,data);if(data.material&&node.material){if(data.material.color)node.material.color.fromArray(data.material.color);if(data.material.emissive)node.material.emissive.fromArray(data.material.emissive);if(data.material.emissiveIntensity!==undefined)node.material.emissiveIntensity=data.material.emissiveIntensity;for(const [key,value]of Object.entries(data.material.uniforms||{})){const u=(node.material.userData?.u||node.material.uniforms)[key];if(Array.isArray(value))u.value.fromArray(value);else u.value=value;}}}

  }

  scene.add(new THREE.AmbientLight(new THREE.Color(0.16,0.16,0.16),1));
  const sun=new THREE.DirectionalLight(new THREE.Color(2.5,2.4,2.3),1);sun.position.set(-0.4,0.85,0.35);scene.add(sun);
