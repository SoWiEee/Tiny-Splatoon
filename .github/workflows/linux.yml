name: Linux CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build pkg-config curl zip unzip tar xvfb pulseaudio pulseaudio-utils libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libx11-xcb-dev libxxf86vm-dev libasound2-dev libpulse-dev libssl-dev libcurl4-openssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            build-linux/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-x64-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p vcpkg
          git -C vcpkg init
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch --depth 1 origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          git -C vcpkg checkout FETCH_HEAD
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        run: >-
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build application and native tests
        run: cmake --build build-linux --parallel 2

      - name: Start a headless audio sink
        run: |
          mkdir -p "$RUNNER_TEMP/pulse-runtime"
          chmod 700 "$RUNNER_TEMP/pulse-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/pulse-runtime" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="$RUNNER_TEMP/pulse-runtime" pulseaudio --start --exit-idle-time=-1
          XDG_RUNTIME_DIR="$RUNNER_TEMP/pulse-runtime" pactl load-module module-null-sink sink_name=ci_sink rate=48000 norewinds=1
          XDG_RUNTIME_DIR="$RUNNER_TEMP/pulse-runtime" pactl set-default-sink ci_sink

      - name: Run CPU and headless native tests
        run: >-
          ctest --test-dir build-linux --output-on-failure
          -E '^(native_zone_visual_gpu|native_player_showcase|native_lobby_visual_gpu|reference_environment_gpu|reference_device_visual_gpu|reference_boss_material_gpu|reference_stage_visual_gpu|reference_projectile_gpu|reference_player_ui_renderer|reference_player_ui_interactions|reference_native_entry_default|reference_character_shaders|reference_character_art|reference_render_pipeline|reference_worldfx_gpu)$'

      - name: Run OpenGL 4.5 smoke tests with software Mesa
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: >-
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24"
          ctest --test-dir build-linux --output-on-failure
          -R '^(reference_render_pipeline|reference_native_entry_default)$'

      - name: Package Linux build
        run: |
          mkdir -p dist/Tiny-Splatoon-linux-x64
          cmake --install build-linux --prefix "$GITHUB_WORKSPACE/dist/Tiny-Splatoon-linux-x64"
          mkdir -p dist/Tiny-Splatoon-linux-x64/lib
          for runtime_dir in build-linux/vcpkg_installed/x64-linux/lib build-linux/vcpkg_installed/x64-linux/bin; do
            if [ -d "$runtime_dir" ]; then
              find "$runtime_dir" -maxdepth 1 -name '*.so*' -exec cp -a -t dist/Tiny-Splatoon-linux-x64/lib -- {} +
            fi
          done
          tar -czf dist/Tiny-Splatoon-linux-x64.tar.gz -C dist Tiny-Splatoon-linux-x64

      - name: Smoke installed package outside its directory
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
        run: |
          cd "$RUNNER_TEMP"
          output="$(xvfb-run --auto-servernum --server-args='-screen 0 1920x1080x24' "$GITHUB_WORKSPACE/dist/Tiny-Splatoon-linux-x64/Tiny-Splatoon" --frames 3)"
          printf '%s\n' "$output"
          [[ "$output" == *'NATIVE_MENU state=stage-select'* ]]

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-Splatoon-linux-x64
          path: dist/Tiny-Splatoon-linux-x64.tar.gz
          if-no-files-found: error
