name: Release Windows and Linux Builds

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC toolchain
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            build-release/vcpkg_installed
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ runner.arch }}-
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg"
          if (-not (Test-Path (Join-Path $vcpkgRoot ".git"))) {
            New-Item -ItemType Directory -Force -Path $vcpkgRoot | Out-Null
            git -C $vcpkgRoot init
            git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          }

          git -C $vcpkgRoot fetch --depth 1 origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          git -C $vcpkgRoot checkout b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat")

      - name: Configure CMake
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:GITHUB_WORKSPACE "vcpkg/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build-release -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTING=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: cmake --build build-release --config Release --target Tiny-Splatoon

      - name: Package release
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME } else { $env:GITHUB_SHA }
          $packageRoot = Join-Path $env:GITHUB_WORKSPACE "dist/Tiny-Splatoon"
          $dllSource = Join-Path $env:GITHUB_WORKSPACE "build-release"
          $archive = Join-Path $env:GITHUB_WORKSPACE "dist/Tiny-Splatoon-$tag-windows-x64.zip"

          Remove-Item $packageRoot -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null

          Copy-Item "build-release/Tiny-Splatoon.exe" $packageRoot
          Copy-Item "build-release/Tiny-Splatoon-Server.exe" $packageRoot
          Copy-Item "build-release/assets" $packageRoot -Recurse

          if (Test-Path $dllSource) {
            Get-ChildItem $dllSource -Filter *.dll | Copy-Item -Destination $packageRoot
          }

          if (Test-Path $archive) {
            Remove-Item $archive -Force
          }

          Compress-Archive -Path "$packageRoot/*" -DestinationPath $archive

      - name: Upload manual build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-Splatoon-windows-x64
          path: dist/Tiny-Splatoon-*-windows-x64.zip

      - name: Create GitHub release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Tiny-Splatoon-${{ github.ref_name }}-windows-x64.zip
          body_path: RELEASE_NOTES.md
          generate_release_notes: true

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential cmake ninja-build pkg-config curl zip unzip tar libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev wayland-protocols libx11-xcb-dev libxxf86vm-dev libasound2-dev libpulse-dev libssl-dev libcurl4-openssl-dev

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            vcpkg/downloads
            build-linux/vcpkg_installed
            ~/.cache/vcpkg/archives
          key: vcpkg-linux-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-linux-x64-

      - name: Bootstrap vcpkg
        run: |
          mkdir -p vcpkg
          git -C vcpkg init
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C vcpkg fetch --depth 1 origin b1b19307e2d2ec1eefbdb7ea069de7d4bcd31f01
          git -C vcpkg checkout FETCH_HEAD
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Configure CMake
        run: >-
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-linux

      - name: Build Linux application
        run: cmake --build build-linux --parallel 2 --target Tiny-Splatoon

      - name: Package Linux release
        run: |
          tag="$GITHUB_SHA"
          if [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"; fi
          mkdir -p dist/Tiny-Splatoon-linux-x64
          cmake --install build-linux --prefix "$GITHUB_WORKSPACE/dist/Tiny-Splatoon-linux-x64"
          mkdir -p dist/Tiny-Splatoon-linux-x64/lib
          for runtime_dir in build-linux/vcpkg_installed/x64-linux/lib build-linux/vcpkg_installed/x64-linux/bin; do
            if [ -d "$runtime_dir" ]; then
              find "$runtime_dir" -maxdepth 1 -name '*.so*' -exec cp -a -t dist/Tiny-Splatoon-linux-x64/lib -- {} +
            fi
          done
          tar -czf "dist/Tiny-Splatoon-${tag}-linux-x64.tar.gz" -C dist Tiny-Splatoon-linux-x64

      - name: Upload manual Linux build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Tiny-Splatoon-linux-x64
          path: dist/Tiny-Splatoon-*-linux-x64.tar.gz

      - name: Upload Linux release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "Tiny Splatoon $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md ||
            gh release view "$GITHUB_REF_NAME" >/dev/null
          gh release upload "$GITHUB_REF_NAME" "dist/Tiny-Splatoon-${GITHUB_REF_NAME}-linux-x64.tar.gz" --clobber
